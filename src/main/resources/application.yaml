spring:
  application:
    name: Turnos
  datasource:
    url: ${bddurl}
    username: ${bbdname}
    password: ${bddpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
    ddl-auto: validate
    show-sql: true
    properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MySQLDialect

  flyway:
        enabled: true
        locations: classpath:db/migration
  jwt:
    secret: ${jwt.secret}
    expiration: ${jwt.expiration}